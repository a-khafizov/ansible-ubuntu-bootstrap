---
# Установка CLI утилит: htop, ncdu, tmux, jq, bat, fzf, zsh

- name: Установка CLI утилит
  apt:
    name: "{{ cli_tools_packages }}"
    state: present
  tags: cli

- name: Проверка наличия Oh-My-Zsh
  stat:
    path: "{{ user_home }}/.oh-my-zsh"
  register: oh_my_zsh_stat
  tags: cli

- name: Установка Oh-My-Zsh (если не установлен)
  shell: sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  when: not oh_my_zsh_stat.stat.exists
  tags: cli

- name: Настройка темы Oh-My-Zsh
  lineinfile:
    path: "{{ user_home }}/.zshrc"
    regexp: '^ZSH_THEME='
    line: 'ZSH_THEME="{{ zsh_theme }}"'
    create: yes
  tags: cli

- name: Настройка плагинов Oh-My-Zsh
  lineinfile:
    path: "{{ user_home }}/.zshrc"
    regexp: '^plugins='
    line: 'plugins=({{ zsh_plugins | join(" ") }})'
    create: yes
  tags: cli

- name: Установка zsh-syntax-highlighting (если не установлен)
  git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
    clone: yes
    update: no
  when: "'zsh-syntax-highlighting' in zsh_plugins"
  tags: cli

- name: Установка zsh-autosuggestions (если не установлен)
  git:
    repo: https://github.com/zsh-users/zsh-autosuggestions
    dest: "{{ user_home }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
    clone: yes
    update: no
  when: "'zsh-autosuggestions' in zsh_plugins"
  tags: cli

- name: Установка Starship (если не установлен)
  shell: curl -sS https://starship.rs/install.sh | sh -s -- -y
  args:
    creates: "{{ user_home }}/.local/bin/starship"
  tags: cli

- name: Добавление инициализации Starship в .zshrc
  lineinfile:
    path: "{{ user_home }}/.zshrc"
    line: 'eval "$(starship init zsh)"'
    create: yes
  tags: cli

- name: Изменение shell пользователя на zsh
  user:
    name: "{{ username }}"
    shell: /usr/bin/zsh
  tags: cli

- name: Добавление алиасов в .zshrc
  blockinfile:
    path: "{{ user_home }}/.zshrc"
    block: |
      alias ll='ls -la'
      alias gs='git status'
      alias gp='git pull'
      alias d='docker'
      alias dc='docker compose'
      alias k='kubectl'
    marker: "# {mark} ANSIBLE MANAGED BLOCK (ALIASES)"
    create: yes
  tags: cli