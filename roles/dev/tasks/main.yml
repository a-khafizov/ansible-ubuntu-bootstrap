---
- name: Update apt cache
  apt:
    update_cache: yes
  changed_when: false
  become: true
  tags: dev

- name: Setup repo NodeSource 
  shell: curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
  args:
    executable: /bin/bash
  changed_when: false
  become: true
  tags: dev

- name: Setup GPG‑key Docker
  apt_key:
    url: https://download.docker.com/linux/ubuntu/gpg
    state: present
  become: true
  tags: dev

- name: Setup repo Docker
  apt_repository:
    repo: deb [arch=amd64] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable
    state: present
  become: true
  tags: dev

- name: Install Docker CE
  apt:
    name: docker-ce
    state: present
  become: true
  tags: dev

- name: Install python, java, nodejs
  apt:
    name:
      - python3-pip
      - python3-venv
      - openjdk-17-jdk
      - nodejs
    state: present
  become: true
  tags: dev

- name: Install VSCode and DBeaver
  snap:
    name: "{{ item }}"
    classic: yes
    state: present
  loop:
    - code
    - dbeaver-ce
  become: true
  tags: dev

