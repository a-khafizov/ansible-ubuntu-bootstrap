---
- name: Update apt cache
  apt:
    update_cache: yes
  become: true
  tags: core
  
- name: Install core packages
  apt:
    name: "{{ core_packages }}"
    state: present
  become: true
  tags: core

- name: Set aliases .bashrc
  blockinfile:
    path: "{{ user_home }}/.bashrc"
    block: |
      alias d='docker'
      alias dc='docker compose'
      alias k='kubectl'
    marker: "# {mark} ANSIBLE MANAGED BLOCK (ALIASES)"
    create: yes
  become: false
  tags: core