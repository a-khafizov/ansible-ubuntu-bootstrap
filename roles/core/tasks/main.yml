---
# Базовая настройка системы: обновление пакетов, установка основных утилит

- name: Обновление списка пакетов
  apt:
    update_cache: yes
  tags: core

- name: Установка основных пакетов
  apt:
    name: "{{ core_packages }}"
    state: present
  tags: core

- name: Установка DBeaver через Snap
  snap:
    name: dbeaver-ce
    classic: yes
    state: present
  tags: core

- name: Создание симлинков для bat и fd
  file:
    src: "/usr/bin/{{ item.src }}"
    dest: "{{ user_home }}/.local/bin/{{ item.dest }}"
    state: link
  loop:
    - { src: "batcat", dest: "bat" }
    - { src: "fdfind", dest: "fd" }
  tags: core

- name: Настройка Git
  git_config:
    name: "{{ item.name }}"
    scope: global
    value: "{{ item.value }}"
  loop:
    - { name: "user.name", value: "{{ git_username }}" }
    - { name: "user.email", value: "{{ git_email }}" }
    - { name: "core.editor", value: "code --wait" }
    - { name: "init.defaultBranch", value: "main" }
    - { name: "pull.rebase", value: "false" }
  tags: core

- name: Добавление алиасов в .bashrc
  blockinfile:
    path: "{{ user_home }}/.bashrc"
    block: |
      alias ll='ls -la'
      alias gs='git status'
      alias gp='git pull'
    marker: "# {mark} ANSIBLE MANAGED BLOCK (ALIASES)"
    create: yes
  tags: core