---
# Установка VS Code через APT (обновлённый плейбук)

- name: Скачать и установить GPG‑ключ Microsoft в правильное расположение
  shell: |
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg && \
    sudo install -D -o root -g root -m 644 microsoft.gpg /usr/share/keyrings/microsoft.gpg && \
    rm -f microsoft.gpg
  args:
    executable: /bin/bash
  tags: vscode

- name: Создать файл репозитория VS Code в sources.list.d
  copy:
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Architectures: amd64,arm64,armhf
      Signed-By: /usr/share/keyrings/microsoft.gpg
    dest: /etc/apt/sources.list.d/vscode.sources
    mode: '0644'
    owner: root
    group: root
  tags: vscode

- name: Обновить кэш пакетов APT
  apt:
    update_cache: yes
  tags: vscode

- name: Установить VS Code
  apt:
    name: code  # или code-insiders, если нужно
    state: present
  tags: vscode

- name: Проверка наличия VS Code
  command: which code
  register: code_check
  ignore_errors: true
  tags: vscode

- name: Настройка VS Code (если установлен)
  when: code_check.rc == 0
  block:
    - name: Установка расширений VS Code
      command: >
        code --install-extension {{ item }} --force --no-sandbox --user-data-dir "{{ user_home }}/.config/Code/User"
      loop: "{{ vscode_extensions }}"
      environment:
        HOME: "{{ user_home }}"
      tags: vscode

    - name: Настройка конфигурации VS Code
      copy:
        content: |
          {
            "editor.renderWhitespace": "all",
            "files.autoSave": "onFocusChange",
            "editor.minimap.enabled": false,
            "workbench.colorTheme": "Default Dark+",
            "terminal.integrated.shell.linux": "/bin/bash"
          }
        dest: "{{ user_home }}/.config/Code/User/settings.json"
        mode: '0644'
        owner: "{{ username }}"
        group: "{{ username }}"
      tags: vscode
