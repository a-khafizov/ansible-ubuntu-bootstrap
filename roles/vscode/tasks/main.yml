---
# Установка VS Code через APT (обновлённый плейбук)

- name: Скачать и установить GPG‑ключ Microsoft в правильное расположение
  shell: |
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > microsoft.gpg && \
    sudo install -D -o root -g root -m 644 microsoft.gpg /usr/share/keyrings/microsoft.gpg && \
    rm -f microsoft.gpg
  args:
    executable: /bin/bash
  become: true
  tags: vscode

- name: Создать файл репозитория VS Code в sources.list.d
  copy:
    content: |
      Types: deb
      URIs: https://packages.microsoft.com/repos/code
      Suites: stable
      Components: main
      Architectures: amd64,arm64,armhf
      Signed-By: /usr/share/keyrings/microsoft.gpg
    dest: /etc/apt/sources.list.d/vscode.sources
    mode: '0644'
    owner: root
    group: root
  become: true
  tags: vscode

- name: Обновить список пакетов после добавления репозитория VS Code
  apt:
    update_cache: yes
  become: true
  tags: vscode

- name: Установить VS Code
  apt:
    name: code  # или code-insiders, если нужно
    state: present
  become: true
  tags: vscode

- name: Запустить VS Code от имени пользователя для создания директории конфигурации
  become: false
  command: code --no-sandbox --wait --new-window
  environment:
    DISPLAY: ":0"
  tags: vscode
  ignore_errors: true  # На случай, если GUI недоступен (например, в CI/CD)



